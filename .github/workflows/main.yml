name: Build DataKos APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o DataKosAndroid_project.zip -d extracted
          ls -la extracted
          find extracted -maxdepth 3 -type f | head -50

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: extracted/DataKosAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataKos-debug
          path: extracted/DataKosAndroid/app/build/outputs/apk/debug/app-debug.apk
