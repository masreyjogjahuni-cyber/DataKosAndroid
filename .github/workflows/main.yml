name: Build Jogjahuni APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP File
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::File ZIP tidak ditemukan di root repositori!"
            exit 1
          fi
          echo "Memuat $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          # Cari folder yang berisi settings.gradle.kts / settings.gradle
          SETTINGS_FILE=$(find extracted -name "settings.gradle.kts" -o -name "settings.gradle" | head -1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::File settings.gradle.kts tidak ditemukan di dalam proyek ZIP!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Folder Proyek Ditemukan di: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Lisensi Android SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Eksekusi kompilasi APK
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jogjahuni-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
